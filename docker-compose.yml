# Lancement : « docker compose up --build » (après avoir copié .env.example en .env).
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - donnees:/srv/data     # la base SQLite survit aux redémarrages du conteneur
    restart: unless-stopped
volumes:
  donnees:
